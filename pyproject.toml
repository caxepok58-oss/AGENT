[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shorts-agent"
version = "0.1.0"
description = "Trend-aware AI agent that researches, scripts, produces and publishes YouTube Shorts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "shorts-agent contributors" }]
keywords = ["youtube", "shorts", "ai-agent", "content-automation", "video-generation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.2",
    "requests>=2.31",
]

[project.optional-dependencies]
llm-anthropic = ["anthropic>=0.40"]
llm-openai = ["openai>=1.40"]
tts = ["edge-tts>=6.1.10"]
tts-elevenlabs = ["elevenlabs>=1.5"]
video = ["moviepy>=1.0.3", "Pillow>=10.3", "numpy>=1.26", "imageio-ffmpeg>=0.5"]
trends = ["pytrends>=4.9"]
youtube = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]
scheduler = ["APScheduler>=3.10"]
all = [
    "anthropic>=0.40",
    "openai>=1.40",
    "edge-tts>=6.1.10",
    "elevenlabs>=1.5",
    "moviepy>=1.0.3",
    "Pillow>=10.3",
    "numpy>=1.26",
    "imageio-ffmpeg>=0.5",
    "pytrends>=4.9",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "APScheduler>=3.10",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
shorts-agent = "shorts_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/shorts_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
