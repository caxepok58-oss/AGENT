name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported interpreters; the versions in between
        # rarely differ and would triple CI time for little signal.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[all,dev]"

      - name: Lint
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type check
        run: mypy src/shorts_agent

      - name: Test
        # The suite makes no network calls, so nothing here needs API keys.
        run: pytest -q

  smoke:
    # Proves the packaged CLI actually starts and that ffmpeg can burn captions
    # — the two failures unit tests cannot catch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[all,dev]"

      - name: CLI starts
        run: |
          shorts-agent version
          shorts-agent --help

      - name: Environment check
        # A missing LLM key is expected in CI and exits 1, so report without
        # failing the job; the render check below is the real gate.
        run: shorts-agent doctor --config config/config.example.yaml || true

      - name: Captions render
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, imageio_ffmpeg
          from shorts_agent.captions import write_ass
          from shorts_agent.config import CaptionsConfig
          from shorts_agent.models import WordTiming

          out = Path("ci-out"); out.mkdir(exist_ok=True)
          timings = [
              WordTiming(word=w, start=i * 0.3, end=i * 0.3 + 0.25)
              for i, w in enumerate("captions really do render".split())
          ]
          ass = write_ass(timings, out / "c.ass", CaptionsConfig())

          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          subprocess.run(
              [ffmpeg, "-hide_banner", "-loglevel", "error", "-y",
               "-f", "lavfi", "-i", "color=c=navy:s=1080x1920:d=2",
               "-vf", f"ass={ass}", "-frames:v", "1", str(out / "f.png")],
              check=True,
          )

          from PIL import Image
          image = Image.open(out / "f.png").convert("RGB")
          colors = image.getcolors(maxcolors=500_000) or []
          text_pixels = sum(n for n, c in colors if min(c) > 225)
          assert text_pixels > 500, f"captions did not render ({text_pixels} text pixels)"
          print(f"captions rendered: {text_pixels} text pixels")
          PY
